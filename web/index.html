<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sistema financiero inteligente y gestor de créditos.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Gestor de Créditos">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Gestor de Créditos</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Estilos premium para pantalla de carga inicial -->
  <style>
    body {
      background-color: #0A0A14;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #FFFFFF;
      background: radial-gradient(circle at center, #14142B 0%, #0A0A14 100%);
    }
    .spinner-box {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .circle-border {
      position: absolute;
      width: 80px;
      height: 80px;
      padding: 3px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      background: linear-gradient(0deg, rgba(108, 92, 231, 0.1) 33%, rgba(108, 92, 231, 1) 100%);
      animation: spin 1s linear infinite;
    }
    .circle-core {
      width: 100%;
      height: 100%;
      background-color: #0D0D19;
      border-radius: 50%;
    }
    .loading-title {
      margin-top: 24px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #6C5CE7;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(108, 92, 231, 0.4);
    }
    .loading-sub {
      margin-top: 8px;
      font-size: 12px;
      color: #A0A0B0;
      letter-spacing: 1px;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Pantalla de carga mientras se compila el Javascript de la App -->
  <div id="loading">
    <div class="spinner-box">
      <div class="circle-border">
        <div class="circle-core"></div>
      </div>
    </div>
    <div class="loading-title">Sistema Financiero</div>
    <div class="loading-sub">Iniciando plataforma segura...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
